Description: |
  Downloads the latest version of CueTimer and builds a package from the app
  in the dmg.
Identifier: com.github.jrmfong.pkg.CueTimer
ParentRecipe: com.github.jrmfong.download.CueTimer
MinimumVersion: "2.9"

Input:
  NAME: CueTimer

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%pathname%/*.app"
