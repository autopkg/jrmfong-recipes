Description: |
  Downloads the latest signed installer package of Eclipse Temurin JDK 25 and
  renames it to include the version.

  The version comes from the package itself, not from the release tag. The
  package reports a version such as 25.0.4.1+1-LTS, so the "-LTS" suffix is
  stripped before the package is renamed.

Identifier: com.github.jrmfong.pkg.EclipseTemurinJDK25
ParentRecipe: com.github.jrmfong.download.EclipseTemurinJDK25
MinimumVersion: "2.7.6"

Input:
  NAME: Eclipse Temurin JDK 25

Process:
  - Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
    Arguments:
      source_pkg: "%pathname%"

  - Processor: FindAndReplace
    Arguments:
      input_string: "%version%"
      find: "-LTS"
      replace: ""
      result_output_var_name: version

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
