Description: |
  Downloads the latest version of Burp Suite Professional and builds a package
  from the app in the dmg.
Identifier: com.github.jrmfong.pkg.BurpSuite
ParentRecipe: com.github.dataJAR-recipes.download.Burp Suite Professional
MinimumVersion: "2.3"

Input:
  NAME: Burp Suite
  DOWNLOAD_ARCH: "MacOsArm64"

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%pathname%/Burp Suite.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%.pkg"
