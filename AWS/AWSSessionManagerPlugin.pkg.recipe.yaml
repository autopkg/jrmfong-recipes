Description: |
  Downloads the latest version of the AWS Session Manager Plugin and renames
  the package to include the version.
Identifier: com.github.jrmfong.pkg.AWSSessionManagerPlugin
ParentRecipe: com.github.nstrauss.download.AWSSessionManagerPlugin
MinimumVersion: "2.3"

Input:
  NAME: AWS Session Manager Plugin
  DOWNLOAD_ARCH: "_arm64"

Process:
- Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
  Arguments:
    source_pkg: "%pathname%"

- Processor: PkgCopier
  Arguments:
    source_pkg: "%pathname%"
    pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
