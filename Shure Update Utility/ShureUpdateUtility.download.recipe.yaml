Description: Downloads the latest signed installer package of Shure Update Utility.
Identifier: com.github.jrmfong.download.ShureUpdateUtility
MinimumVersion: "2.3"

Input:
  NAME: Shure Update Utility
  DOWNLOAD_URL: https://www.shure.com/en-US/sw/suu-mac

Process:
  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.pkg"
      url: "%DOWNLOAD_URL%"

  # The check phase ends here, so a CI run can reuse a cached download.
  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%"
      strict_verification: true
      deep_verification: true
      expected_authority_names:
        - "Developer ID Installer: Shure Incorporated (4K6323CXC4)"
        - Developer ID Certification Authority
        - Apple Root CA
