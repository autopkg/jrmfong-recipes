Description: |
  Downloads the most recent signed release pkg of Smooze Pro.

Identifier: com.github.jrmfong.download.SmoozePro
MinimumVersion: '2.9'

Input:
  NAME: Smooze Pro
  SOFTWARE_TITLE: '%NAME%'
  INCLUDE_PRERELEASES: 'False'
  DOWNLOAD_MISSING_FILE: 'True'
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: 'False'

Process:
  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: '%DOWNLOAD_MISSING_FILE%'
      filename: '%SOFTWARE_TITLE%.dmg'

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: 'download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False'

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: '%RECIPE_CACHE_DIR%/downloads/%SOFTWARE_TITLE%.dmg/Bruno.app'
      requirement: anchor apple generic and identifier "co.smoozepro.macos" and (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "6TT7VL9KAT")
      strict_verification: true
