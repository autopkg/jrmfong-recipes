Description: |
  Downloads the latest version of Smooze Pro and builds a package from
  the app in the dmg.

Identifier: com.github.jrmfong.pkg.SmoozePro
ParentRecipe: com.github.jrmfong.download.SmoozePro
MinimumVersion: '2.9'

Input:
  NAME: Smooze Pro

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: '%pathname%/%NAME%.app'
