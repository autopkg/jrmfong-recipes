Description: |
  Downloads the latest version of MyDPD Customer and builds a package
  from the app in the dmg.

Identifier: com.github.jrmfong.pkg.MyDPDCustomer
ParentRecipe: com.github.jrmfong.download.MyDPDCustomer
MinimumVersion: "2.9"

Input:
  NAME: MyDPD Customer

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%pathname%/%NAME%.app"
