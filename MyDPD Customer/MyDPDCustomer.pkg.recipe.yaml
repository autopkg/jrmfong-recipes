Description: |
  Downloads the most recent signed release pkg of MyDPD Customer.

Identifier: com.github.jrmfong.pkg.MyDPDCustomer
ParentRecipe: com.github.jrmfong.download.MyDPDCustomer
MinimumVersion: "2.9"

Input:
  NAME: MyDPD Customer

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%RECIPE_CACHE_DIR%/downloads/%NAME%.dmg/%NAME%.app"
