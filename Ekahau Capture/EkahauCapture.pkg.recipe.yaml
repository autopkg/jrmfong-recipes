Identifier: com.github.jrmfong.pkg.EkahauCapture
ParentRecipe: com.github.jrmfong.download.EkahauCapture
MinimumVersion: "2.9"

Input:
  NAME: Ekahau Capture

Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%pathname%/%NAME%.app"
