Description: |
  Downloads the latest version of SnowSQL and renames the package to include
  the version.
Identifier: com.github.jrmfong.pkg.SnowSQL
ParentRecipe: com.github.jrmfong.download.SnowSQL
MinimumVersion: "2.9"

Input:
  NAME: SnowSQL

Process:
- Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
  Arguments:
    source_pkg: "%pathname%"

- Processor: PkgCopier
  Arguments:
    source_pkg: "%pathname%"
    pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
