Description: |
  Downloads the latest signed installer package of SnowSQL for Apple silicon.

  The vendor download page is behind a Cloudflare challenge, so the recipe
  reads the Snowflake package repository instead. SnowSQLInfoProvider, in this
  directory, picks the newest darwin_arm64 package by comparing the version
  numbers, because the repository indexes are sorted as text.

Identifier: com.github.jrmfong.download.SnowSQL
MinimumVersion: "2.9"

Input:
  NAME: SnowSQL
  REPO_URL: https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/
  DOWNLOAD_MISSING_FILE: "True"

Process:
  - Processor: SnowSQLInfoProvider
    Arguments:
      base_url: "%REPO_URL%"
      platform: darwin_arm64

  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: "%DOWNLOAD_MISSING_FILE%"
      filename: "%NAME%.pkg"
      url: "%url%"

  # The check phase ends here, so a CI run can reuse a cached download.
  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      strict_verification: true
      input_path: "%pathname%"
      expected_authority_names:
       - "Developer ID Installer: Snowflake Computing INC. (W4NT6CRQ7U)"
       - "Developer ID Certification Authority"
       - "Apple Root CA"
