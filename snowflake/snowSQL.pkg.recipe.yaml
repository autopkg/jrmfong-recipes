Description: Downloads and package the latest version of snowflake snowSQL and renames the package.
Identifier: com.github.jrmfong.pkg.snowSQL
ParentRecipe: com.github.jrmfong.download.snowSQL
MinimumVersion: "2.3"

Input:
  NAME: snowSQL

Process:
- Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
  Arguments:
    source_pkg: "%pathname%"

- Processor: PkgCopier
  Arguments:
    source_pkg: "%pathname%"
    pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
