Description: Downloads the latest version of Yamaha TF Editor.
Identifier: com.github.jrmfong.download.YamahaTFEditor
MinimumVersion: "2.3"

Input:
  NAME: Yamaha TF Editor
  BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED: "False"

Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: 'id="d([0-9]+)">TF Editor'
      url: https://uk.yamaha.com/en/support/updates/tf_edt_mac.html

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.zip"
      url: "https://uk.yamaha.com/en/download/files/%match%/"

  - Processor: EndOfCheckPhase

  - Processor: StopProcessingIf
    Arguments:
      predicate: "download_changed == False AND %BYPASS_STOP_PROCESSING_IF_DOWNLOAD_UNCHANGED% == False"

  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/unzip"

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/unzip/*.pkg"
      strict_verification: true
      deep_verification: true
      expected_authority_names:
        - "Developer ID Installer: Yamaha Corporation (5LE7A8CF65)"
        - Developer ID Certification Authority
        - Apple Root CA
