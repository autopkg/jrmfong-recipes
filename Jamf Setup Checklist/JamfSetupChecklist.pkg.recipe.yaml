Description: |
  Downloads the latest version of Jamf Setup Checklist and renames the
  package to include the version.

Identifier: com.github.jrmfong.pkg.JamfSetupChecklist
ParentRecipe: com.github.jrmfong.download.JamfSetupChecklist
MinimumVersion: "2.9"

Input:
  NAME: Jamf Setup Checklist

Process:
  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
