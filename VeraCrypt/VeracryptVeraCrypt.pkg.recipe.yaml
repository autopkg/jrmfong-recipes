Description: |
  Downloads the latest version of VeraCrypt and renames the installer package
  to include the version.
Identifier: com.github.jrmfong.pkg.Veracrypt
ParentRecipe: com.github.dataJAR-recipes.download.VeraCrypt
MinimumVersion: "2.3"

Input:
  NAME: Veracrypt

Process:
- Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
  Arguments:
    source_pkg: "%pathname%/VeraCrypt_Installer.pkg"

- Processor: PkgCopier
  Arguments:
    source_pkg: "%pathname%/VeraCrypt_Installer.pkg"
    pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"

