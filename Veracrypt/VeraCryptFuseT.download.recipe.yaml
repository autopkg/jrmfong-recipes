Description: |
  Downloads the latest signed FUSE-T build of VeraCrypt.

  VeraCrypt ships 2 macOS builds per release. This recipe takes the FUSE-T one,
  VeraCrypt_FUSE-T_<version>.dmg. Veracrypt.download takes the macFUSE one.

  The FUSE-T build needs fuse-t installed first. Its installer checks for
  /usr/local/lib/libfuse-t.dylib and refuses to run without it, so deploy
  com.github.jrmfong.pkg.FuseT ahead of this package. It also needs macOS 12 or
  later.

  The upstream recipe, com.github.dataJAR-recipes.download.VeraCrypt, cannot
  reach this build. Its asset_regex requires a digit straight after
  "VeraCrypt_", and an override can set Input but cannot change a Process
  argument. Hence this separate recipe.

Identifier: com.github.jrmfong.download.VeracryptFuseT
MinimumVersion: "2.9"

Input:
  NAME: VeraCrypt-FUSE-T
  GITHUB_REPO: veracrypt/VeraCrypt
  DOWNLOAD_MISSING_FILE: "True"

Process:
  - Processor: GitHubReleasesInfoProvider
    Comment: >-
      The FUSE-T asset only. The macFUSE build drops the FUSE-T part of the
      name, so this pattern cannot match it.
    Arguments:
      github_repo: "%GITHUB_REPO%"
      asset_regex: VeraCrypt_FUSE-T_([0-9]+(\.[0-9]+)+)\.dmg$

  - Processor: URLDownloaderPython
    Arguments:
      download_missing_file: "%DOWNLOAD_MISSING_FILE%"
      filename: "%NAME%.dmg"
      url: "%url%"

  # The check phase ends here, so a CI run can reuse a cached download.
  - Processor: EndOfCheckPhase

  # The first step that mounts the dmg, and it sits after the marker.
  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/VeraCrypt_Installer.pkg"
      strict_verification: true
      deep_verification: true
      expected_authority_names:
        - "Developer ID Installer: Mounir Joseph IDRASSI (HLTN5GLG99)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
