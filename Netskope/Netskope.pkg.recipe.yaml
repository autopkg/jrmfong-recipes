Description: |
  Downloads the latest Netskope Client installer package from your tenant and
  renames it to include the version.

  The parent downloads from https://<HOSTNAME>/dlr/mac/get. Its default
  HOSTNAME, download-company.goskope.com, is a placeholder, so set HOSTNAME to
  your own tenant in an override before you run this recipe.

  The parent checks the installer signature for netSkope, Inc. (24W52P9M7W)
  but does not set strict_verification.

Identifier: com.github.jrmfong.pkg.Netskope
ParentRecipe: com.github.patgmac.download.Netskope
MinimumVersion: "2.3"

Input:
  NAME: Netskope Client

Process:
  - Processor: com.github.grahampugh.recipes.commonprocessors/PkgInfoReader
    Arguments:
      source_pkg: "%pathname%"

  - Processor: PkgCopier
    Arguments:
      source_pkg: "%pathname%"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
